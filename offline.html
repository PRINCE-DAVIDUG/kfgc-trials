<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <meta name="theme-color" content="#08203a">

  <title>Offline — KFGC Media App</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #08203a;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 20px;
    }

    .offline {
      max-width: 420px;
    }

    .offline img {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 20px;
    }

    h1 {
      margin-bottom: 10px;
    }

    p {
      line-height: 1.6;
      opacity: .9;
    }

    button {
      margin-top: 20px;
      padding: 12px 22px;
      border: 0;
      border-radius: 8px;
      background: white;
      color: #08203a;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <div class="offline">

    <img src="kfgc.jpg" alt="Kirinda Full Gospel Church">

    <h1>You are offline</h1>

    <p>
      KFGC Media App is currently unable to connect to the internet.
      Please check your connection and try again.
    </p>

    <button onclick="location.reload()">
      Try Again
    </button>

  </div>

</body>
      </html>
